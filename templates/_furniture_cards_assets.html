<style>
  .fcards { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:20px; }
  .fcard { position:relative; display:flex; flex-direction:column; min-width:0; background:#fff; border:1px solid #eeebe6; transition:box-shadow .25s ease, border-color .25s ease; }
  .fcard:hover { border-color:#e0dbd3; box-shadow:0 16px 34px rgba(55,50,45,.1); }
  .fcard[hidden] { display:none; }
  .fcard-link { display:flex; flex:1; flex-direction:column; color:inherit; text-decoration:none; }
  .fcard-photo { position:relative; aspect-ratio:4 / 3; overflow:hidden; background:#f1eee9; }
  .fcard-photo img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; transition:opacity .35s ease, transform .6s ease; }
  .fcard-photo.is-cutout, .fcard-photo .is-cutout { background:#faf9f7; }
  .fcard-photo.is-cutout .fcard-main, .fcard-photo .fcard-hover.is-cutout { padding:6%; object-fit:contain; }
  .fcard-hover { opacity:0; }
  .fcard:hover .fcard-hover { opacity:1; }
  .fcard:hover .fcard-main { transform:scale(1.03); }
  .fcard-copy { padding:13px 14px 16px; }
  .fcard-copy small { display:block; color:#8b847c; font-size:.68rem; font-weight:600; letter-spacing:.1em; text-transform:uppercase; }
  .fcard-copy h3 { margin:6px 0 5px; color:#37322d; font-size:.98rem; font-weight:500; line-height:1.35; }
  .fcard-copy span { display:block; color:#7a736c; font-size:.76rem; line-height:1.45; }
  .fcard > .wishlist-toggle { top:9px; right:9px; width:36px; min-height:36px; }
  .fcards-more { display:flex; flex-direction:column; align-items:center; gap:9px; margin-top:32px; }
  .fcards-more p { margin:0; color:#7a736c; font-size:.8rem; }
  .fcards-more button { min-height:46px; padding:0 26px; border:1px solid #37322d; color:#37322d; background:#fff; font:inherit; font-size:.84rem; }
  .fcards-more button:hover { color:#fff; background:#37322d; }
  @media(max-width:1199.98px) { .fcards { grid-template-columns:repeat(3,minmax(0,1fr)); } }
  @media(max-width:767.98px) { .fcards { grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; } .fcard-copy { padding:10px 10px 12px; } .fcard-copy h3 { font-size:.86rem; } .fcard-copy small { font-size:.62rem; } .fcard-copy span { font-size:.7rem; } .fcard > .wishlist-toggle { width:32px; min-height:32px; top:7px; right:7px; } }
</style>
<script>
(function () {
  document.querySelectorAll('[data-fcards]').forEach(function (grid) {
    var wrap = document.querySelector(grid.dataset.moreTarget); if (!wrap) return;
    var total = parseInt(grid.dataset.total || '0', 10), button = wrap.querySelector('button'), note = wrap.querySelector('p');
    function count() { return grid.querySelectorAll('[data-fcard]').length; }
    function update() { var n = count(); note.textContent = 'Showing ' + n + ' of ' + total + ' pieces'; wrap.hidden = total <= n && n <= 24; button.hidden = n >= total; }
    button.addEventListener('click', function () {
      var url = new URL(window.location.href); url.searchParams.set('cards_from', count());
      button.disabled = true; button.textContent = 'Loading…';
      fetch(url.toString()).then(function (r) { return r.ok ? r.text() : ''; }).then(function (html) {
        var holder = document.createElement('div'); holder.innerHTML = html;
        Array.prototype.slice.call(holder.children).forEach(function (el) { grid.appendChild(el); });
        if (window.UniglobeWishlist) window.UniglobeWishlist.refresh();
      }).finally(function () { button.disabled = false; button.textContent = 'Show more pieces'; update(); });
    });
    update();
  });
})();
</script>
