<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>
{% block title %}Uniglobe Livings{% endblock %}
</title>

<meta name="description" content="{% block meta_description %}Uniglobe Lifestyles Pvt Ltd is a global furniture sourcing and procurement company specializing in guided China factory visits, project-based sourcing, and consolidated international delivery for developers and architects worldwide.{% endblock %}">

<meta name="robots" content="index, follow">

<link rel="canonical" href="{{ request.url_root.rstrip('/') }}{{ request.path }}">

<meta property="og:site_name" content="Uniglobe Lifestyles">
<meta property="og:title" content="{% block og_title %}Uniglobe Lifestyles | Furniture, Tiles &amp; Surfaces{% endblock %}">
<meta property="og:description" content="{% block og_description %}Explore furniture, tiles, surface finishes and bathware for residential and commercial projects. Discover both sides of Uniglobe Lifestyles and speak with our team for product and project guidance.{% endblock %}">
<meta property="og:type" content="website">
<meta property="og:url" content="{{ request.url }}">
<meta property="og:image" content="{% block og_image %}{{ url_for('static', filename='images/share-uniglobe.jpg', _external=True) }}{% endblock %}">
<meta property="og:image:type" content="image/jpeg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Uniglobe Lifestyles logo for furniture, tiles and surfaces">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ self.og_title() }}">
<meta name="twitter:description" content="{{ self.og_description() }}">
<meta name="twitter:image" content="{{ self.og_image() }}">



  <link rel="icon" type="image/webp" href="{{ url_for('static', filename='images/Black.webp') }}">

  <!-- Stylesheets -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="preconnect" href="https://cdnjs.cloudflare.com">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/business-choice.css') }}">


  <style>
    body { font-family: 'DM Sans', sans-serif; -webkit-font-smoothing: antialiased; }
    .navbar-brand img { display: block; width: 450px; max-width: 48vw; max-height: 100px; object-fit: contain; }
      @media (max-width: 576px) {
    .navbar-brand {
      flex-wrap: nowrap !important;
    }

    .navbar-brand img { width: 180px; max-height: 46px !important; margin-right: 8px; }

    .navbar-brand span {
      font-size: 1.1rem !important;
      white-space: nowrap;
    }
  }
    .navbar-brand {
      margin-left: 0 !important;
      padding-left: 0 !important;
    }
    .navbar { min-height: 82px; padding-left: 0; padding-right: 0; }
    .navbar .container { max-width: 1440px; padding-left: 20px; padding-right: 20px; }
    @media (max-width: 768px) {
      .navbar-brand span {
        font-size: 1rem;
      }
    }
    /* Navbar Hover Effect */
    .navbar-nav .nav-link { transition: color 0.2s ease; }

    .navbar-nav .nav-link:hover {
      color: #84735f;
    }

    .business-switch {
      display: inline-flex;
      gap: 3px;
      padding: 5px;
      border: 1px solid #e6e1da;
      border-radius: 999px;
      background: #faf9f7;
      white-space: nowrap;
      box-shadow: 0 3px 12px rgba(54, 45, 34, .09);
      max-width: 100%;
    }

    .business-switch a {
      padding: 10px 18px;
      border-radius: 999px;
      color: #5e5a54;
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: .035em;
      text-decoration: none;
      transition: background-color 0.2s ease, color 0.2s ease, box-shadow 0.2s ease;
    }

    .business-switch a:hover,
    .business-switch a.active {
      background: #84735f;
      color: #fff;
    }
    .business-switch a:focus-visible { outline: 2px solid #84735f; outline-offset: 2px; }
    .furniture-nav .nav-link { color: #33312e !important; font-size: .88rem; letter-spacing: .01em; padding: .65rem .8rem !important; }
    .furniture-nav .nav-link:hover { color: #84735f !important; }
    .business-nav-layout {
      display: flex !important;
      align-items: center;
      gap: 10px;
      flex: 0 0 auto;
      width: auto;
      min-width: 0;
    }
    .business-nav-layout > .nav-item { display: flex; justify-content: center; align-items: center; width: auto; min-width: 0; margin: 0; }
    .business-nav-layout > .nav-item:first-child { justify-content: center; }
    .business-nav-layout .nav-link { display: block; width: 100%; padding: .65rem .2rem !important; text-align: center; white-space: nowrap; font-size: .82rem; }
    .wishlist-nav-count { display:inline-grid; place-items:center; min-width:18px; height:18px; margin-left:4px; padding:0 5px; border-radius:999px; color:#fff; background:#84735f; font-size:.61rem; font-weight:700; vertical-align:middle; }
    .wishlist-toggle { display:inline-flex; justify-content:center; align-items:center; gap:8px; min-height:42px; padding:9px 13px; border:1px solid #bcb6ad; color:#514b44; background:#fff; font:inherit; font-size:.8rem; cursor:pointer; transition:background .2s ease,color .2s ease,border-color .2s ease; }
    .wishlist-toggle:hover,.wishlist-toggle.is-saved { border-color:#84735f; color:#fff; background:#84735f; }
    .wishlist-toggle .wishlist-heart { color:#a17d69; font-size:1.2rem; line-height:1; }
    .wishlist-toggle.is-saved .wishlist-heart { color:#ffe4d4; }
    .wishlist-toggle--overlay { position:absolute; z-index:3; top:10px; right:10px; width:40px; min-height:40px; padding:0; border:0; border-radius:50%; box-shadow:0 3px 12px rgba(0,0,0,.18); }
    .wishlist-toggle--overlay .wishlist-label { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; }

    .business-choice-dialog {
      width: min(800px, calc(100vw - 32px));
    }

    .modal-backdrop.show {
      background-color: rgba(28, 29, 29, 0.24);
      opacity: 1;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }

    .business-choice-open .navbar,
    .business-choice-open .hero-content {
      position: relative;
      z-index: 1052;
    }

    .business-choice-content {
      border: 0;
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.24);
    }

    .business-choice-card {
      display: block;
      width: 100%;
      padding: 0;
      overflow: hidden;
      border: 1px solid #e9e6e1;
      border-radius: 16px;
      background: #fff;
      color: #222;
      text-align: left;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .business-choice-card:hover,
    .business-choice-card:focus-visible {
      transform: translateY(-3px);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.12);
    }

    .business-choice-card img {
      display: block;
      width: 100%;
      height: 175px;
      object-fit: cover;
    }

    .business-choice-copy {
      padding: 16px 18px 18px;
    }

    .business-choice-copy h3 {
      margin: 0 0 5px;
      font-size: 1.1rem;
      font-weight: 600;
    }

    .business-choice-copy p {
      margin: 0;
      color: #6b6b6b;
      font-size: 0.9rem;
      line-height: 1.45;
    }

    @media (min-width: 1200px) and (max-width: 1399.98px) {
      .navbar-brand img { width: 450px; max-height: 100px; }
      .business-nav-layout { grid-template-columns: 220px repeat(6, minmax(0, 1fr)); gap: 4px; }
      .business-nav-layout .nav-link { font-size: .74rem; padding-right: .15rem !important; padding-left: .15rem !important; }
      .business-switch a { padding: 9px 15px; font-size: .92rem; }
    }

    @media (max-width: 1199.98px) {
      .navbar { min-height: 70px; }
      .navbar .navbar-collapse { padding: 8px 0 20px; }
      .business-nav-layout { display: flex !important; flex-direction: column; align-items: flex-start !important; width: 100%; }
      .business-nav-layout > .nav-item { display: block; width: 100%; }
      .business-nav-layout .nav-link { display: inline-block; width: auto; text-align: left; font-size: .9rem; padding: .55rem .25rem !important; }
      .business-switch {
        margin: 8px 0 4px;
      }
    }

    @media (max-width: 575.98px) {
      .business-choice-dialog {
        margin: 12px auto;
      }

      .business-choice-content {
        border-radius: 18px;
      }

      .business-choice-card {
        display: grid;
        grid-template-columns: 112px minmax(0, 1fr);
        min-height: 96px;
      }

      .business-choice-card img {
        height: 96px;
        min-height: 96px;
      }

      .business-choice-copy {
        align-self: center;
        padding: 12px;
      }

      .business-choice-copy h3 {
        font-size: 1rem;
      }

      .business-choice-copy p {
        font-size: 0.82rem;
      }
    }

  </style>

  <script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Organization",
  "name": "Uniglobe Lifestyles Pvt Ltd",
  "alternateName": "Uniglobe Lifestyles",
  "url": "https://uniglobelifestyles.com",
  "logo": "https://uniglobelifestyles.com/static/images/Black.webp",
  "description": "Uniglobe Lifestyles Pvt Ltd is a global furniture sourcing and China procurement company offering guided factory visits and consolidated international project delivery.",
  "areaServed": "Worldwide"
}
</script>
</head>


<body data-business-entry="furniture">

<!-- Navbar -->
<nav class="navbar navbar-expand-xl navbar-light bg-white shadow-sm py-2">
  <div class="container d-flex justify-content-between align-items-center">
    <a class="navbar-brand d-flex flex-wrap align-items-center gap-2" href="/">
      <img src="{{ url_for('static', filename='images/Black.webp') }}" alt="Uniglobe Lifestyles Pvt Ltd Logo">
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
      aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
      <ul class="navbar-nav align-items-xl-center furniture-nav business-nav-layout">
        <li class="nav-item">
          <div class="business-switch" aria-label="Choose a business">
            <a href="/" class="active" aria-current="page" onclick="localStorage.setItem('uniglobeBusinessChoice', 'furniture');localStorage.setItem('uniglobeBusinessChoiceAt', Date.now().toString())">Furniture</a>
            <a href="{{ url_for('tiles_home') }}" onclick="localStorage.setItem('uniglobeBusinessChoice', 'surfaces');localStorage.setItem('uniglobeBusinessChoiceAt', Date.now().toString())">Surfaces</a>
          </div>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="/" title="Home">Home</a>
        </li>
        <li class="nav-item"><a class="nav-link" href="/about">About Us</a></li>
        <li class="nav-item"><a class="nav-link" href="/products" onclick="localStorage.removeItem('activeCategory')">Products</a></li>
        <li class="nav-item"><a class="nav-link" href="/catalogs">Catalogs</a></li>
        <li class="nav-item"><a class="nav-link" href="/services">Services</a></li>
        <li class="nav-item"><a class="nav-link {{ 'active' if request.path == '/wishlist' else '' }}" href="{{ url_for('furniture_wishlist') }}">Wishlist <span class="wishlist-nav-count" id="wishlistNavCount" hidden>0</span></a></li>
        <li class="nav-item"><a class="nav-link" href="/contact">Contact Us</a></li>
      </ul>
    </div>
  </div>
</nav>

<!-- Page Content -->
<div class="content">
  {% block content %}{% endblock %}
</div>

{% include 'business_choice_modal.html' %}

<!-- Bootstrap Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
{% include 'business_choice_script.html' %}
{% include 'wishlist_script.html' %}
<script>
document.addEventListener("DOMContentLoaded", function () {
  const buttons = document.querySelectorAll(".category-btn");
  const sections = document.querySelectorAll(".category-section");

  buttons.forEach(button => {
    button.addEventListener("click", function () {
      const category = this.dataset.category;

      buttons.forEach(btn => btn.classList.remove("active"));
      this.classList.add("active");

      sections.forEach(section => {
        if (category === "all" || section.dataset.category === category) {
          section.style.display = "block";
        } else {
          section.style.display = "none";
        }
      });
    });
  });
});
</script>
</body>
</html>
