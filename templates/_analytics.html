{# Google Analytics 4. Turned on only when GA_MEASUREMENT_ID is set on the server (see DEPLOY.md). #}
{% if ga_measurement_id %}
<script async src="https://www.googletagmanager.com/gtag/js?id={{ ga_measurement_id }}"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', {{ ga_measurement_id|tojson }});
  // Count the ways people get in touch, so enquiries can be traced to pages.
  document.addEventListener('click', function (e) {
    var a = e.target.closest && e.target.closest('a[href]');
    if (!a) return;
    var href = a.getAttribute('href') || '';
    var kind = /wa\.me|api\.whatsapp\.com/.test(href) ? 'whatsapp_click'
             : href.indexOf('tel:') === 0 ? 'phone_click'
             : href.indexOf('mailto:') === 0 ? 'email_click'
             : /drive\.google\.com|\.pdf($|\?)/.test(href) ? 'catalogue_download'
             : /google\.[a-z.]+\/maps|maps\.app\.goo\.gl|goo\.gl\/maps/.test(href) ? 'directions_click'
             : null;
    if (kind) gtag('event', kind, { link_url: href, page_path: location.pathname });
  }, true);
  document.addEventListener('submit', function (e) {
    var f = e.target;
    if (f && f.method && f.method.toLowerCase() === 'post' && !/manage|upload|admin/.test(f.action || ''))
      gtag('event', 'enquiry_form_submit', { page_path: location.pathname });
  }, true);
</script>
{% endif %}
