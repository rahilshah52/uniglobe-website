{# A row of tile designs this visitor opened recently (kept in their own browser only). #}
<section class="recent-row" id="recentRow" hidden aria-label="Recently viewed designs">
  <div class="container">
    <div class="recent-head"><h2>Recently viewed</h2><button type="button" id="recentClear">Clear</button></div>
    <div class="recent-list" id="recentList"></div>
  </div>
</section>
<style>
  .recent-row { padding:34px 0 38px; border-top:1px solid #ecece7; background:#fff; }
  .recent-head { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:14px; }
  .recent-head h2 { margin:0; color:#2f3532; font-size:1.25rem; font-weight:400; letter-spacing:-.02em; }
  .recent-head button { padding:0; border:0; border-bottom:1px solid #c3c7c2; color:#5f6662; background:none; font:inherit; font-size:.78rem; cursor:pointer; }
  .recent-list { display:flex; gap:12px; overflow-x:auto; padding-bottom:6px; scroll-snap-type:x proximity; }
  .recent-item { flex:0 0 170px; color:inherit; text-decoration:none; scroll-snap-align:start; }
  .recent-item span { display:block; aspect-ratio:4 / 3; overflow:hidden; background:#eeefeb; }
  .recent-item img { display:block; width:100%; height:100%; object-fit:cover; }
  .recent-item b { display:block; margin-top:7px; overflow:hidden; color:#2f3532; font-size:.84rem; font-weight:500; text-overflow:ellipsis; white-space:nowrap; }
  .recent-item small { color:#7d847f; font-size:.72rem; }
  @media(max-width:767.98px) { .recent-item { flex-basis:140px; } }
</style>
<script>
(function () {
  var row = document.getElementById('recentRow'), list = document.getElementById('recentList'), items = [];
  try { items = JSON.parse(localStorage.getItem('uniglobeRecentTiles') || '[]'); } catch (e) {}
  var here = location.pathname;
  items = (Array.isArray(items) ? items : []).filter(function (x) { return x && typeof x.url === 'string' && x.url.charAt(0) === '/' && x.url.charAt(1) !== '/' && x.url !== here; });
  if (!items.length) return;
  items.slice(0, 10).forEach(function (x) {
    var a = document.createElement('a'); a.className = 'recent-item'; a.href = x.url;
    var box = document.createElement('span'), img = document.createElement('img');
    img.loading = 'lazy'; img.alt = ''; if (typeof x.image === 'string' && x.image.charAt(0) === '/') img.src = x.image;
    box.appendChild(img); a.appendChild(box);
    var b = document.createElement('b'); b.textContent = x.name || 'Tile design'; a.appendChild(b);
    if (x.series) { var s = document.createElement('small'); s.textContent = x.series + ' series'; a.appendChild(s); }
    list.appendChild(a);
  });
  row.hidden = false;
  document.getElementById('recentClear').addEventListener('click', function () { try { localStorage.removeItem('uniglobeRecentTiles'); } catch (e) {} row.hidden = true; });
})();
</script>
